[project]
name = "langraph-update"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rahulkumar997", email = "kumarrahulraj3235@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.13",
    "langsmith>=0.14.4",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "setuptools>=84.0.0",
]

[project.scripts]
langraph-update = "langraph_update:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
